name: Android app (Play Store)

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building an UNSIGNED bundle that Play Store will not accept."
          fi

      - name: Build app bundle (.aab) and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: meow-diary-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      # Debug-signed APK: installs directly on a phone for testing.
      - uses: actions/upload-artifact@v4
        with:
          name: meow-diary-test-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      # Easy phone download: always-current test APK on the "test-build" release.
      - name: Publish test APK to the test-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk meow-diary-test.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Meow Diary test build" --notes "APK สำหรับทดสอบ ติดตั้งบน Android ได้ทันที (อัปเดตอัตโนมัติทุกครั้งที่ build บน main)"
          gh release upload test-build meow-diary-test.apk --clobber
