plugins {
    id 'com.android.application'
}

// The web app this Android app shows in its own WebView.
def siteHost = 'likewacom-web.github.io'
def launchUrl = "https://${siteHost}/Meow-Diary/"

android {
    namespace 'com.likewacom.meowdiary'
    compileSdk 36

    defaultConfig {
        applicationId 'com.likewacom.meowdiary'
        minSdk 23
        targetSdk 36
        // CI passes -PversionCode=<run number> so every upload gets a higher code.
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName '1.0.' + versionCode

        resValue 'string', 'hostName', siteHost
        resValue 'string', 'launchUrl', launchUrl
        // Firebase Auth's Google "Web client ID" (public); native sign-in exchanges
        // the Google ID token for a Firebase session in the web page.
        resValue 'string', 'googleWebClientId', '731296956907-joc2c3ur9615d1n2k7fv4cu1eebg2fra.apps.googleusercontent.com'
    }

    signingConfigs {
        // Fixed key for test builds, so its fingerprint can be listed in the
        // website's assetlinks.json and the app opens full screen. Test only:
        // Play Store builds use the private upload key from repo secrets.
        debug {
            storeFile file('test-signing.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
